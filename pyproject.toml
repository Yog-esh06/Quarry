[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quarry"
version = "1.0.0"
description = "Causal root-cause analysis, label-free performance estimation and gated self-repair for production ML models"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "YOGESH R MEHTA" }]
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "python-multipart>=0.0.9",
  "pyjwt>=2.8",
  "bcrypt>=4.0",
  "numpy>=1.26",
  "pandas>=2.2",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "networkx>=3.2",
  "pyarrow>=15",
  "prometheus-client>=0.20",
  "celery>=5.3",
  "redis>=5",
  "psycopg2-binary>=2.9",
  "httpx>=0.27",
]

[project.optional-dependencies]
# Deep-ensemble MLP (epistemic uncertainty). CPU wheels are enough:
#   pip install torch --index-url https://download.pytorch.org/whl/cpu
torch = ["torch>=2.2"]
# Optional mirror of runs/model versions into an MLflow tracking server.
mlflow = ["mlflow-skinny>=2.12"]
# Embedded PostgreSQL for scripts/verify_postgres.py (no Docker needed).
verify = ["pgserver>=0.1"]
dev = ["pytest>=8", "pytest-cov>=5"]

[project.scripts]
quarry = "app.cli:main"

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend", "."]
addopts = "-q -p no:cacheprovider"
markers = [
  "slow: end-to-end scenario and benchmark tests (seconds to a minute on CPU)",
  "torch: tests that require PyTorch",
]
filterwarnings = [
  "ignore::DeprecationWarning:celery.*",
]
